# YAML file to define move_base config
 
controller_frequency: 10.0                    # The rate in Hz at which to run the control loop and send velocity commands to the base.
recovery_behaviour_enabled: true              # Whether or not to enable the move_base recovery behaviors to attempt to clear out space.
planner_patience: 5.0                         # How long the planner will wait in seconds in an attempt to find a valid plan before space-clearing operations are performed. 
controller_patience: 5.0                      # How long the controller will wait in seconds without receiving a valid control before space-clearing operations are performed. 

                                              # The rate in Hz at which to run the global planning loop. If the frequency is set to 0.0, the global planner will only run
planner_frequency : 0.0                       # when a new goal is received or the local planner reports that its path is blocked.
[project]
name = "iddmbse-cp-demo"
version = "0.1.0"
description = "Case study B2: robust perception via conformal prediction for AGR navigation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cpnav"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# On this workstation a sourced ROS 2 Jazzy environment puts
# /opt/ros/jazzy/lib/python3.12/site-packages on PYTHONPATH, so pytest
# auto-loads the ament and launch_testing plugins from it and fails on their
# own missing dependencies. This case study needs none of them.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint"

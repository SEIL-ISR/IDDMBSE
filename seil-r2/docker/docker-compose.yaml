name: seil-r2

# Settings shared by both services are kept in extension fields
# https://docs.docker.com/compose/compose-file/compose-file-v3/#extension-fields
x-default-seil-r2-volumes: &default-seil-r2-volumes
  # The sources are bind-mounted, so edits on the host are visible in the
  # container right away.
  - type: bind
    source: ../src
    target: ${DOCKER_WORKSPACE_PATH}/src
  # The colcon output stays in named volumes: it survives container restarts and
  # no root-owned build artefacts land in the checkout on the host.
  - type: volume
    source: seil-r2-build
    target: ${DOCKER_WORKSPACE_PATH}/build
  - type: volume
    source: seil-r2-install
    target: ${DOCKER_WORKSPACE_PATH}/install
  - type: volume
    source: seil-r2-log
    target: ${DOCKER_WORKSPACE_PATH}/log

x-default-seil-r2-environment: &default-seil-r2-environment
  - WORKSPACE_PATH=${DOCKER_WORKSPACE_PATH}
  - ROS2_DISTRO=${ROS2_DISTRO}

x-default-seil-r2-deploy: &default-seil-r2-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [ gpu ]

services:
  # ROS 2 Humble and the workspace's system dependencies
  iddmbse-seil-r2-base:
    profiles: [ "base" ]
    env_file: .env.base
    build:
      context: ../
      dockerfile: docker/Dockerfile.base
      args:
        - ROS2_BASE_IMAGE_ARG=${ROS2_BASE_IMAGE}
        - ROS2_DISTRO_ARG=${ROS2_DISTRO}
        - WORKSPACE_PATH_ARG=${DOCKER_WORKSPACE_PATH}
        - DOCKER_USER_HOME_ARG=${DOCKER_USER_HOME}
    image: iddmbse-seil-r2-base
    container_name: iddmbse-seil-r2-base
    environment: *default-seil-r2-environment
    volumes: *default-seil-r2-volumes
    network_mode: host
    deploy: *default-seil-r2-deploy
    entrypoint: /entrypoint.sh
    command: bash
    stdin_open: true
    tty: true

  # The same image with the workspace built by colcon
  iddmbse-seil-r2-ros2:
    profiles: [ "ros2" ]
    env_file:
      - .env.base
      - .env.ros2
    build:
      context: ../
      dockerfile: docker/Dockerfile.ros2
      args:
        - BASE_IMAGE_ARG=iddmbse-seil-r2-base
    image: iddmbse-seil-r2-ros2
    container_name: iddmbse-seil-r2-ros2
    environment:
      - WORKSPACE_PATH=${DOCKER_WORKSPACE_PATH}
      - ROS2_DISTRO=${ROS2_DISTRO}
      - RMW_IMPLEMENTATION=${SEILR2_RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${SEILR2_ROS_DOMAIN_ID}
      - FASTRTPS_DEFAULT_PROFILES_FILE=${SEILR2_FASTRTPS_PROFILES_FILE}
      - CYCLONEDDS_URI=${SEILR2_CYCLONEDDS_URI}
    volumes: *default-seil-r2-volumes
    network_mode: host
    deploy: *default-seil-r2-deploy
    entrypoint: /entrypoint.sh
    command: bash
    stdin_open: true
    tty: true

volumes:
  seil-r2-build:
  seil-r2-install:
  seil-r2-log:

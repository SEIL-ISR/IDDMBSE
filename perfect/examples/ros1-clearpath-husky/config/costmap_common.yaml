footprint: [[-0.5, -0.33], [-0.5, 0.33], [0.5, 0.33], [0.5, -0.33]]
footprint_padding: 0.01

robot_base_frame: base_link
update_frequency: 4.0
publish_frequency: 3.0
transform_tolerance: 0.5

resolution: 0.05

obstacle_range: 5.5
raytrace_range: 6.0

static:
    map_topic: /map
    subscribe_to_updates: true

obstacles_laser:
    observation_sources: lidar2d rear_lidar2d lidar3d
    lidar2d:
        data_type: LaserScan
        clearing: true
        marking: true
        topic: front/scan
        inf_is_valid: true
    rear_lidar2d:
        data_type: LaserScan
        clearing: true
        marking: true
        topic: rear/scan
        inf_is_valid: true
    lidar3d:
        data_type: PointCloud2
        clearing: true
        marking: true
        topic: velodyne_points

inflation:
    inflation_radius: 1.0

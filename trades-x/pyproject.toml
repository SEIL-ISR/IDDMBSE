[project]
name = "tradesx"
version = "0.1.0"
description = "TRADES-X: tradeoff analysis and design space exploration for IDDMBSE"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ad = [
    "jax[cpu]>=0.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradesx"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# On this workstation a sourced ROS 2 Jazzy environment puts
# /opt/ros/jazzy/lib/python3.12/site-packages on PYTHONPATH, so pytest
# auto-loads the ament and launch_testing plugins from it and fails on their
# own missing dependencies. TRADES-X needs none of them.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint"

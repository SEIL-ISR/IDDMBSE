[project]
name = "iddmbse-demos"
version = "0.1.0"
description = "Animations rendered from the recorded PERFECT, Isaac Sim range, VERITAS and case-study results"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# A sourced ROS 2 Jazzy environment puts its site-packages on PYTHONPATH and pytest
# would auto-load the ament and launch_testing plugins from it.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
